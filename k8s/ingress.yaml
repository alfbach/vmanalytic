# Optional: requires an Ingress controller (nginx, traefik, etc.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vmanalytic
  namespace: vmanalytic
  labels:
    app.kubernetes.io/name: vmanalytic
  annotations:
    # Match Flask MAX_CONTENT_LENGTH (256 MB) and Gunicorn --timeout 600
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: vmanalytic.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vmanalytic
                port:
                  number: 80
